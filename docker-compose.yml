services:
  mongodb:
    image: mongo:6.0
    container_name: 5g_mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      ran_net:
        ipv4_address: 10.53.1.20

  open5gs:
    build:
      context: .
      dockerfile: docker/Dockerfile.open5gs
    container_name: 5g_open5gs
    restart: unless-stopped
    privileged: true
    environment:
      - MONGODB_IP=10.53.1.20
      - OPEN5GS_IP=10.53.1.2
      - UPF_ADVERTISE_IP=10.53.1.2
      - UE_IP_BASE=10.45.0
      - MCC=001
      - MNC=01
      - NETWORK_NAME_FULL=OCUDU
      - NETWORK_NAME_SHORT=OCUDU
      - SUBSCRIBER_DB=001010123456780,00112233445566778899aabbccddeeff,opc,63bfa50ee6523365ff14c1f45f88737d,8000,9,10.45.0.2
    command: 5gc -c open5gs-5gc.yml
    depends_on:
      - mongodb
    networks:
      ran_net:
        ipv4_address: 10.53.1.2

  ocudu-gnb:
    image: ocudu-gnb:latest
    container_name: 5g_ocudu_gnb
    restart: "no"
    cap_add:
      - SYS_NICE
    volumes:
      - ./configs/gnb_zmq.yaml:/opt/ocudu/gnb_zmq.yaml:ro
    command: ["-c", "/opt/ocudu/gnb_zmq.yaml"]
    depends_on:
      - open5gs
    networks:
      ran_net:
        ipv4_address: 10.53.1.3

  srs-ue:
    image: srs-ue:latest
    container_name: 5g_srs_ue
    restart: "no"
    privileged: true
    volumes:
      - ./configs/ue_zmq.conf:/opt/srsran/ue_zmq.conf:ro
    command: ["/opt/srsran/ue_zmq.conf"]
    depends_on:
      - ocudu-gnb
    networks:
      ran_net:
        ipv4_address: 10.53.1.4

volumes:
  mongodb_data:

networks:
  ran_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.53.1.0/24
