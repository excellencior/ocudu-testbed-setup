services:
  ubuntu:
    container_name: ocudu-sandbox
    build: .
    volumes:
      - ./ocudu:/ocudu
    mem_limit: 24g
    memswap_limit: 24g
    command: ["sleep", "infinity"]
    hostname: "ocudu"
    networks:
      - sandboxnet

networks:
  sandboxnet:
    name: Sandboxnet
    driver: bridge
